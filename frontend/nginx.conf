# Serve o build do Vite. O nginx principal (pasta /nginx) faz o proxy de / para cá.
server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # CSP da aplicação: scripts só do próprio domínio; fontes do Google; imagens externas (fotos de perfil) só via HTTPS.
    # Se a API ficar em outro domínio (VITE_API_BASE_URL absoluto), inclua-o em connect-src.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome nunca mudam: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para pegar o deploy novo na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    # Rotas do React Router caem no index.html
    location / {
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
