# Serve o build do Vite. O nginx principal (pasta /nginx) faz o proxy de / para cá.
server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome nunca mudam: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para pegar o deploy novo na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
