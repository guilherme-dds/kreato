# Healthchecks: cada serviço só sobe depois que as dependências respondem.
services:
  minio:
    # Imagem fixada pelo digest (MinIO RELEASE.2025-09-07T16-13-09Z): "latest" mudaria sozinho a cada pull
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    container_name: kreato-minio
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      # Sem senha padrão: a stack não sobe sem credenciais definidas
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER (credencial do MinIO)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD (credencial do MinIO)}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER (credencial do MinIO)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD (credencial do MinIO)}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: kreato-redis
    # AOF em volume: limites de tentativa e o stream de auditoria ainda não consumido sobrevivem a reinícios
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: kreato-log-service
    expose:
      - "3335"
    environment:
      PORT: 3335
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3334
      # Segurança: docs da API, proxies confiáveis e origens de CORS (vazio = só o mesmo domínio)
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3335/health').then((r) => { process.exitCode = r.ok ? 0 : 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kreato-nginx
    ports:
      - "${KREATO_PORT:-8209}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: kreato-auth-service
    expose:
      - "3334"
    environment:
      PORT: 3334
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379
      # Segurança: docs da API, proxies confiáveis e origens de CORS (vazio = só o mesmo domínio)
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Cookie da sessão só por HTTPS; vazio = detecta pelo X-Forwarded-Proto
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3334/health').then((r) => { process.exitCode = r.ok ? 0 : 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kreato-backend
    expose:
      - "3333"
    environment:
      PORT: 3333
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3334
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER (credencial do MinIO)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD (credencial do MinIO)}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER (credencial do MinIO)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD (credencial do MinIO)}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-avatars}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_PRICE_CREATOR: ${STRIPE_PRICE_CREATOR:-}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO:-}
      # E-mails de convite (mesmos provedores do auth-service)
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN:-}
      MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL}
      # Segurança: docs da API, proxies confiáveis e origens de CORS (vazio = só o mesmo domínio)
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then((r) => { process.exitCode = r.ok ? 0 : 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 15s
      timeout: 5s
      retries: 5
      # A primeira subida sincroniza o schema do banco antes de abrir a porta
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Embutida no bundle no build; vazio = usa /api (mesmo domínio, via nginx)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: kreato-frontend
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  minio-data:
  redis-data:

# Sub-rede fixa: hosts com muitas stacks esgotam os pools automáticos do Docker
# ("all predefined address pools have been fully subnetted"). Se a faixa colidir
# com outra rede do servidor, defina KREATO_SUBNET nas variáveis da stack.
networks:
  default:
    ipam:
      config:
        - subnet: ${KREATO_SUBNET:-10.209.0.0/24}
