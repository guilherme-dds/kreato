events {}

http {
    # Anexos de conteúdo aceitam até 100 MB por arquivo (ver AttachmentController)
    client_max_body_size 110M;
    server_tokens off;

    # Se houver um proxy HTTPS na frente (hospedagem), repassa o protocolo original;
    # os serviços usam isso para marcar o cookie de sessão como Secure.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Cabeçalhos repassados a todos os serviços (não repita proxy_set_header dentro de um location:
    # isso descarta todos os herdados daqui)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 80;

        # Cabeçalhos de segurança em todas as respostas (a CSP vem do nginx do frontend)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        location /api/auth {
            proxy_pass http://auth-service:3334;
        }

        location /api/create {
            proxy_pass http://auth-service:3334;
        }

        # Documentação: os serviços só respondem com ENABLE_API_DOCS=true
        location /auth/apidocs {
            proxy_pass http://auth-service:3334;
        }

        location /auth/openapi.json {
            proxy_pass http://auth-service:3334;
        }

        location /apidocs {
            proxy_pass http://auth-service:3334;
        }

        location /log/apidocs {
            proxy_pass http://log-service:3335;
        }

        location /log/openapi.json {
            proxy_pass http://log-service:3335;
        }

        location /api/logs {
            proxy_pass http://log-service:3335/logs;
        }

        location /api/ {
            proxy_pass http://backend:3333;
        }

        location / {
            proxy_pass http://frontend:5173;
        }
    }
}
