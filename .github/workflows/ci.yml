name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, auth-service, log-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      # Cliente do Prisma (só os serviços com banco); não conecta em nada
      - if: matrix.service != 'log-service'
        run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - if: matrix.service == 'backend'
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Valida o docker-compose.yml com valores fictícios para as variáveis obrigatórias
      - run: docker compose config --quiet
        env:
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-password
